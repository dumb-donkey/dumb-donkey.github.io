<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Command Center</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#111826; --panel2:#0e1420; --line:#1e2a3d;
    --text:#e6edf6; --dim:#7c8ba1; --accent:#3ba9ff; --accent2:#00e0c6;
    --danger:#ff5c72; --tile:#141d2e; --tile-h:#1a2740;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 75% -10%,#12203a 0,var(--bg) 60%);
    color:var(--text); min-height:100vh; padding:28px 32px 60px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ---- top bar ---- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .greet{font-size:26px;font-weight:700;letter-spacing:.3px}
  .greet span{color:var(--accent)}
  .sub{color:var(--dim);font-size:14px;margin-top:2px}
  .clock{text-align:right}
  .time{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .date{color:var(--dim);font-size:14px;margin-top:6px}

  /* ---- controls row ---- */
  .bar{display:flex;gap:12px;align-items:center;margin-bottom:26px;flex-wrap:wrap}
  .search{flex:1;min-width:240px;position:relative}
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:14px 16px 14px 44px;border-radius:12px;font-size:15px;outline:none;transition:.15s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,169,255,.15)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:13px 18px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--tile-h);border-color:var(--accent)}
  .btn.primary{background:linear-gradient(90deg,var(--accent),#2f74ff);border:none;color:#fff}
  .btn.ghost{background:transparent}

  /* ---- categories ---- */
  .cat{margin-bottom:34px}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .cat-head h2{font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
  .cat-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2)}
  .cat-head .count{color:var(--dim);font-size:13px;font-weight:600}
  .cat-head .edit-cat{margin-left:auto;color:var(--dim);cursor:pointer;font-size:13px;opacity:0;transition:.15s}
  .cat:hover .edit-cat{opacity:1}
  .cat-head .edit-cat:hover{color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .tile{
    position:relative;background:var(--tile);border:1px solid var(--line);border-radius:14px;
    padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;overflow:hidden;
  }
  .tile:hover{background:var(--tile-h);border-color:var(--accent);transform:translateY(-2px)}
  .tile .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:linear-gradient(135deg,#1c2942,#182136)}
  .tile .meta{min-width:0}
  .tile .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .url{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .tile .kill{position:absolute;top:8px;right:10px;color:var(--dim);opacity:0;font-size:16px;transition:.15s}
  .tile:hover .kill{opacity:.6}
  .tile .kill:hover{opacity:1;color:var(--danger)}
  .tile.add{border-style:dashed;justify-content:center;color:var(--dim);font-weight:600}
  .tile.add:hover{color:var(--accent)}

  .empty{color:var(--dim);text-align:center;padding:80px 20px;font-size:15px;line-height:1.7}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;width:100%;max-width:440px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .modal h3{font-size:19px;margin-bottom:20px}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:13px;color:var(--dim);margin-bottom:7px;font-weight:600}
  .fld input,.fld select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font-size:15px;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--accent)}
  .fld .hint{color:var(--dim);font-size:12px;margin-top:6px}
  .row{display:flex;gap:10px}
  .row .fld{flex:1}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .icon-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .icon-pick span{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:18px}
  .icon-pick span.sel{border-color:var(--accent);background:var(--tile-h)}

  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:40px}
  ::placeholder{color:#4a5a72}
</style>
</head>
<body>

<header>
  <div>
    <div class="greet" id="greet">Command Center</div>
    <div class="sub" id="sub">Your day, one screen.</div>
  </div>
  <div class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="fulldate"></div>
  </div>
</header>

<div class="bar">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="search" type="text" placeholder="Search your tools…  (just start typing)" autofocus>
  </div>
  <button class="btn primary" onclick="openAdd()">+ Add link</button>
  <button class="btn" onclick="openCatAdd()">+ Add group</button>
  <button class="btn ghost" onclick="openSettings()">⚙︎</button>
</div>

<div id="board"></div>

<footer>Everything you add is saved right here in this browser. Use ⚙︎ → Backup to save a copy.</footer>

<!-- Link modal -->
<div class="overlay" id="linkModal">
  <div class="modal">
    <h3 id="linkModalTitle">Add link</h3>
    <div class="fld">
      <label>Name</label>
      <input id="lName" placeholder="e.g. ServiceNow">
    </div>
    <div class="fld">
      <label>Web address</label>
      <input id="lUrl" placeholder="e.g. servicenow.mycompany.com">
      <div class="hint">Just paste the link. I'll add https:// for you if needed.</div>
    </div>
    <div class="fld">
      <label>Group</label>
      <select id="lCat"></select>
    </div>
    <div class="fld">
      <label>Icon</label>
      <div class="icon-pick" id="iconPick"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModals()">Cancel</button>
      <button class="btn primary" onclick="saveLink()">Save</button>
    </div>
  </div>
</div>

<!-- Category modal -->
<div class="overlay" id="catModal">
  <div class="modal">
    <h3 id="catModalTitle">Add group</h3>
    <div class="fld">
      <label>Group name</label>
      <input id="cName" placeholder="e.g. Daily Tools">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="catDelBtn" onclick="deleteCat()" style="margin-right:auto;color:var(--danger)">Delete group</button>
      <button class="btn ghost" onclick="closeModals()">Cancel</button>
      <button class="btn primary" onclick="saveCat()">Save</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="setModal">
  <div class="modal">
    <h3>Settings</h3>
    <div class="fld">
      <label>Your name (for the greeting)</label>
      <input id="sName" placeholder="e.g. Zeno">
    </div>
    <div class="modal-actions" style="justify-content:space-between">
      <div style="display:flex;gap:10px">
        <button class="btn" onclick="exportData()">⬇ Backup</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">⬆ Restore</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
      </div>
      <button class="btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
/* ---------------- data ---------------- */
const ICONS = ["🎫","🔐","🛠️","📊","📁","📧","📅","💬","☁️","🌐","🖥️","📈","🧰","🔎","📝","⚙️","🚀","🏢","👥","💡"];
const SEED = {
  name: "",
  cats: [
    { id: cid(), name: "Daily Tools", links: [
      { id: cid(), name:"ServiceNow", url:"https://servicenow.com", icon:"🎫" },
      { id: cid(), name:"Company Login", url:"https://login.microsoftonline.com", icon:"🔐" },
      { id: cid(), name:"Email", url:"https://outlook.office.com", icon:"📧" },
    ]},
    { id: cid(), name: "References", links: [
      { id: cid(), name:"Knowledge Base", url:"https://example.com", icon:"📁" },
    ]},
  ]
};
function cid(){ return Math.random().toString(36).slice(2,9); }

let data = load();
let editingLink = null;   // {catId, linkId} or null
let editingCat = null;    // catId or null
let selIcon = ICONS[0];

function load(){
  try{
    const raw = localStorage.getItem("commandCenter");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){ localStorage.setItem("commandCenter", JSON.stringify(data)); }

/* ---------------- render ---------------- */
function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const board = document.getElementById("board");
  board.innerHTML = "";
  let shown = 0;

  data.cats.forEach(cat => {
    const links = cat.links.filter(l =>
      !q || l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q));
    if(q && links.length === 0) return;

    const sec = document.createElement("div");
    sec.className = "cat";
    sec.innerHTML = `
      <div class="cat-head">
        <span class="dot"></span>
        <h2>${esc(cat.name)}</h2>
        <span class="count">${cat.links.length}</span>
        <span class="edit-cat" onclick="openCatEdit('${cat.id}')">edit group</span>
      </div>
      <div class="grid" id="grid-${cat.id}"></div>`;
    board.appendChild(sec);
    const grid = sec.querySelector(".grid");

    links.forEach(l => {
      shown++;
      const t = document.createElement("a");
      t.className = "tile";
      t.href = l.url; t.target = "_blank"; t.rel="noopener";
      t.innerHTML = `
        <div class="ico">${l.icon || "🌐"}</div>
        <div class="meta">
          <div class="name">${esc(l.name)}</div>
          <div class="url">${esc(prettyUrl(l.url))}</div>
        </div>
        <span class="kill" title="Remove" onclick="event.preventDefault();event.stopPropagation();removeLink('${cat.id}','${l.id}')">✕</span>`;
      grid.appendChild(t);
    });

    if(!q){
      const add = document.createElement("div");
      add.className = "tile add";
      add.textContent = "+ Add link";
      add.onclick = () => openAdd(cat.id);
      grid.appendChild(add);
    }
  });

  if(q && shown === 0){
    board.innerHTML = `<div class="empty">No tools match “${esc(q)}”.<br>Press Esc to clear.</div>`;
  }
}

function prettyUrl(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- link modal ---------------- */
function buildIconPick(){
  const box = document.getElementById("iconPick");
  box.innerHTML = "";
  ICONS.forEach(ic => {
    const s = document.createElement("span");
    s.textContent = ic;
    if(ic === selIcon) s.className = "sel";
    s.onclick = () => { selIcon = ic; buildIconPick(); };
    box.appendChild(s);
  });
}
function fillCatSelect(){
  const sel = document.getElementById("lCat");
  sel.innerHTML = data.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
}
function openAdd(catId){
  editingLink = null;
  document.getElementById("linkModalTitle").textContent = "Add link";
  document.getElementById("lName").value = "";
  document.getElementById("lUrl").value = "";
  selIcon = ICONS[0];
  fillCatSelect(); buildIconPick();
  if(catId) document.getElementById("lCat").value = catId;
  show("linkModal"); document.getElementById("lName").focus();
}
function openLinkEdit(catId, linkId){
  const link = data.cats.find(c=>c.id===catId).links.find(l=>l.id===linkId);
  editingLink = {catId, linkId};
  document.getElementById("linkModalTitle").textContent = "Edit link";
  document.getElementById("lName").value = link.name;
  document.getElementById("lUrl").value = link.url;
  selIcon = link.icon || ICONS[0];
  fillCatSelect(); buildIconPick();
  document.getElementById("lCat").value = catId;
  show("linkModal");
}
function saveLink(){
  const name = document.getElementById("lName").value.trim();
  let url = document.getElementById("lUrl").value.trim();
  const catId = document.getElementById("lCat").value;
  if(!name || !url){ alert("Give it a name and a link."); return; }
  if(!/^https?:\/\//i.test(url)) url = "https://" + url;

  if(editingLink){
    // remove from old cat, add to selected
    const oldCat = data.cats.find(c=>c.id===editingLink.catId);
    const idx = oldCat.links.findIndex(l=>l.id===editingLink.linkId);
    const link = oldCat.links[idx];
    link.name=name; link.url=url; link.icon=selIcon;
    if(editingLink.catId !== catId){
      oldCat.links.splice(idx,1);
      data.cats.find(c=>c.id===catId).links.push(link);
    }
  } else {
    data.cats.find(c=>c.id===catId).links.push({id:cid(),name,url,icon:selIcon});
  }
  save(); closeModals(); render();
}
function removeLink(catId, linkId){
  const cat = data.cats.find(c=>c.id===catId);
  const link = cat.links.find(l=>l.id===linkId);
  if(!confirm(`Remove “${link.name}”?`)) return;
  cat.links = cat.links.filter(l=>l.id!==linkId);
  save(); render();
}

/* ---------------- category modal ---------------- */
function openCatAdd(){
  editingCat = null;
  document.getElementById("catModalTitle").textContent = "Add group";
  document.getElementById("cName").value = "";
  document.getElementById("catDelBtn").style.display = "none";
  show("catModal"); document.getElementById("cName").focus();
}
function openCatEdit(catId){
  editingCat = catId;
  const cat = data.cats.find(c=>c.id===catId);
  document.getElementById("catModalTitle").textContent = "Edit group";
  document.getElementById("cName").value = cat.name;
  document.getElementById("catDelBtn").style.display = data.cats.length>1 ? "block":"none";
  show("catModal"); document.getElementById("cName").focus();
}
function saveCat(){
  const name = document.getElementById("cName").value.trim();
  if(!name){ alert("Give the group a name."); return; }
  if(editingCat){ data.cats.find(c=>c.id===editingCat).name = name; }
  else { data.cats.push({id:cid(),name,links:[]}); }
  save(); closeModals(); render();
}
function deleteCat(){
  const cat = data.cats.find(c=>c.id===editingCat);
  if(!confirm(`Delete group “${cat.name}” and its ${cat.links.length} link(s)?`)) return;
  data.cats = data.cats.filter(c=>c.id!==editingCat);
  save(); closeModals(); render();
}

/* ---------------- settings ---------------- */
function openSettings(){
  document.getElementById("sName").value = data.name || "";
  show("setModal");
}
function saveSettings(){
  data.name = document.getElementById("sName").value.trim();
  save(); closeModals(); greet();
}
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "command-center-backup.json";
  a.click();
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{ data = JSON.parse(r.result); save(); closeModals(); greet(); render(); alert("Restored."); }
    catch(err){ alert("That file didn't look right."); }
  };
  r.readAsText(file);
}

/* ---------------- modals helpers ---------------- */
function show(id){ closeModals(); document.getElementById(id).classList.add("on"); }
function closeModals(){ document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("on")); }
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{ if(e.target===o) closeModals(); }));

/* ---------------- clock + greeting ---------------- */
function tick(){
  const d = new Date();
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,"0");
  const ap = h>=12?"PM":"AM"; const h12 = ((h+11)%12)+1;
  document.getElementById("time").textContent = `${h12}:${m} ${ap}`;
  document.getElementById("fulldate").textContent =
    d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
}
function greet(){
  const h = new Date().getHours();
  const part = h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const nm = data.name ? `, <span>${esc(data.name)}</span>` : "";
  document.getElementById("greet").innerHTML = `${part}${nm}`;
  document.getElementById("sub").textContent = "Everything you need, one screen.";
}

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    const anyOpen=[...document.querySelectorAll(".overlay")].some(o=>o.classList.contains("on"));
    if(anyOpen){ closeModals(); }
    else { document.getElementById("search").value=""; render(); }
  }
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); document.getElementById("search").focus(); }
});
document.getElementById("search").addEventListener("input", render);

/* double-click a tile name area to edit — handled via kill button + long-press alt: add edit btn */
document.getElementById("board").addEventListener("contextmenu", e=>{
  const tile = e.target.closest(".tile");
  if(tile && !tile.classList.contains("add")){
    e.preventDefault();
    // find link
    for(const c of data.cats){ for(const l of c.links){
      if(tile.querySelector(".name").textContent===l.name){ openLinkEdit(c.id,l.id); return; }
    }}
  }
});

/* ---------------- go ---------------- */
greet(); tick(); render();
setInterval(tick, 1000);
</script>
</body>
</html>
